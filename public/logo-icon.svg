<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0C0E14" stroke="#222737" stroke-width="2"/>
  
  <!-- Outer Glow Hexagon / Frame -->
  <path d="M24 8L38 16V32L24 40L10 32V16L24 8Z" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Prompt Code Terminal Bracket & AI Star -->
  <path d="M18 20L14 24L18 28" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 20L34 24L30 28" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Diamond Spark -->
  <path d="M24 17L26 24L24 31L22 24Z" fill="url(#brandGrad)" filter="url(#glow)"/>
  <circle cx="24" cy="24" r="2" fill="#FFFFFF"/>
</svg>
